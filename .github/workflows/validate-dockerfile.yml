name: validate-dockerfile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: validate dockerfile (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: worker
            context: images/worker
          - image: void-builder
            context: images/void-builder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.context }}/Dockerfile

      - name: Build image
        run: docker build --pull ${{ matrix.context }}
