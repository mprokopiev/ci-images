name: validate-dockerfile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: validate dockerfile (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: worker
            context: images/worker
          - image: void-builder
            context: images/void-builder
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.context }}/Dockerfile

      - name: Build image
        run: docker build --pull ${{ matrix.context }}
