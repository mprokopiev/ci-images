name: validate-dockerfile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: validate dockerfile (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: worker
            context: images/worker
            smoke: |
              . /etc/os-release
              printf 'os: %s%s\n' "$PRETTY_NAME" "${VERSION_ID:+ $VERSION_ID}"
              ldd --version 2>&1 | head -2 || :
              betterleaks version
              just --version
              flyctl version
              step version
              python3 --version
              python3 -c 'import ssl, json'
              node --version
              npm --version
              age --version
              sops --version
              yamllint --version
              docker --version
              docker compose version
              docker buildx version
              jq --version
              yq --version
              git --version
          - image: void-builder
            context: images/void-builder
            smoke: |
              . /etc/os-release
              printf 'os: %s%s\n' "$PRETTY_NAME" "${VERSION_ID:+ $VERSION_ID}"
              ldd --version 2>&1 | head -2 || :
              bash --version | head -1
              git --version
              curl --version | head -1
              xbps-query -V
              tar --version | head -1
              xz --version | head -1
              zstd --version
              gcc --version | head -1
              make --version | head -1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.context }}/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          pull: true
          no-cache: true
          push: false
          load: true
          tags: ci-smoke/${{ matrix.image }}:${{ github.run_id }}

      - name: Smoke test binaries
        env:
          IMAGE: ci-smoke/${{ matrix.image }}:${{ github.run_id }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          set -o pipefail
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint bash "$IMAGE" -euxo pipefail -c "$SMOKE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
