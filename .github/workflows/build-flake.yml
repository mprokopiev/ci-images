name: build-flake

on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - .github/workflows/build-flake.yml
  pull_request:
    paths:
      - flake.lock
      - flake.nix
      - .github/workflows/build-flake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-shell:
    name: build nix dev shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build dev shell
        run: nix build --no-link .#devShells.x86_64-linux.default
