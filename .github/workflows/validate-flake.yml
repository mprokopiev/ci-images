name: build-flake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-shell:
    name: build nix dev shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check

      - name: Build dev shell
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Run pre-commit
        run: nix develop --command pre-commit run --all-files
