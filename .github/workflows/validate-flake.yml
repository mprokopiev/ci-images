name: build-flake

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-shell:
    name: build nix dev shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Check flake
        run: nix flake check

      - name: Build dev shell
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Run pre-commit
        run: nix develop --command pre-commit run --all-files
