---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.239.1
    hooks:
      - id: renovate-config-validator
        language_version: system
        files: renovate.json

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: (^|/)Dockerfile$

      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$
